<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="chat-container">
            <div class="chat-header">
                <h1>🤖 AI Assistant</h1>
                <p class="status">Online</p>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant-message">
                    <div class="message-content">
                        Hello! I'm your AI Assistant. How can I help you today?
                    </div>
                </div>
            </div>
            
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="userInput" 
                        placeholder="Type your message here..." 
                        class="message-input"
                        autocomplete="off"
                    >
                    <button id="sendBtn" class="send-button">
                        <span class="send-icon">➤</span>
                    </button>
                </div>
                <div class="info-text">
                    Press Enter or click the button to send
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="settings-panel">
                <h3>Settings</h3>
                
                <div class="setting-group">
                    <label for="modelSelect">Model:</label>
                    <select id="modelSelect" class="model-select">
                        <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                        <option value="gpt-4">GPT-4</option>
                        <option value="gpt-4-turbo">GPT-4 Turbo</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label for="temperatureSlider">Temperature: <span id="tempValue">0.7</span></label>
                    <input 
                        type="range" 
                        id="temperatureSlider" 
                        min="0" 
                        max="2" 
                        step="0.1" 
                        value="0.7"
                        class="slider"
                    >
                </div>

                <div class="setting-group">
                    <label for="maxTokens">Max Tokens: <span id="tokenValue">150</span></label>
                    <input 
                        type="range" 
                        id="maxTokens" 
                        min="50" 
                        max="2000" 
                        step="50" 
                        value="150"
                        class="slider"
                    >
                </div>

                <button id="clearBtn" class="clear-button">Clear Chat</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
